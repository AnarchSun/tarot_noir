name: tarot_noir
description: "A mystic app combining tarot readings, AI chatbot and NFT avatars."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  # Local prototype journal and preferences; no remote service.
  shared_preferences: ^2.5.5

  cupertino_icons: ^1.0.8

  # HTTP / API
  http: ^1.5.0

  # Solana / SPL Token
  reown_appkit: ^1.9.0
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  flutter_facebook_auth: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/tarot_temp/
